name: Contextual template sync
description: Open a pull request that merges a template repository's new commits into a repository created from it.
author: Contextual

inputs:
  template-repository:
    description: The template repository, as owner/name.
    required: true
  template-branch:
    description: The template branch to sync from.
    default: main
  directory:
    description: The folder holding this repository's copy of the template, relative to the repository root.
    default: .
  organization:
    description: The Contextual organization whose GitHub connection covers this repository. The sync then uses a token from the organization's GitHub App instead of `token`. Defaults to `CONTEXTUAL_ORGANIZATION` in a `contextual-deploy.env` committed in `directory`.
    default: ""
  token:
    description: The token that checks out the repository, pushes the sync branch and opens the pull request, when no organization is given.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - id: exchange
      shell: bash
      env:
        ORGANIZATION: ${{ inputs.organization }}
        DIRECTORY: ${{ inputs.directory }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        READ_TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/exchange.sh"'
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 0
        token: ${{ steps.exchange.outputs.token || inputs.token }}
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - shell: bash
      env:
        GH_TOKEN: ${{ steps.exchange.outputs.token || inputs.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        TEMPLATE_REPOSITORY: ${{ inputs.template-repository }}
        TEMPLATE_BRANCH: ${{ inputs.template-branch }}
        DIRECTORY: ${{ inputs.directory }}
      run: '"$GITHUB_ACTION_PATH/template-sync.sh"'
